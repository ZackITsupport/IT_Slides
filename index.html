# IT Coordinator
### Zack Spring Chief

![](images/Zacks_ProPic.jpg)

---

## My Role

As the IT Coordinator, my role is to help connect the day-to-day work of the IT team with the larger goals of the department.

Some of my focus areas are:

- Coordinating IT operations and projects
- Supporting the technical team
- Helping improve IT processes and workflows
- Infrastructure planning and improvements
- API Development

![](images/API.gif)

---

# Where We Are Going

One of the main goals for IT is to become more organized and proactive.

We don't want IT to only be reacting to tickets and problems.

We need to be looking ahead at:

- Infrastructure
- Security
- Software and applications
- Projects
- Documentation
- User support
- Hardware and asset management

The goal is to build an IT department that can support the organization as it grows.

![](images/infraV4.png)

---

# Team & Collaboration

IT has several different areas that all depend on each other.

### Operations

Network, hardware, service calls and day-to-day technical support.

### Projects

Larger system implementations, upgrades and projects that require planning and coordination.

### Cyber Security

Protecting our systems, users and information.

### Applications & Support

Making sure employees can use the applications and systems they need to do their jobs.

These areas need to communicate with each other rather than operating separately.

---

# Documentation

One area I want us to improve is documentation.

If we solve a problem today, we should not have to solve the same problem from scratch six months from now.

We need to document:

- Network configurations
- System information
- Troubleshooting procedures
- Application procedures
- Common fixes
- Project information
- Infrastructure changes

Documentation should be something the whole team can use and contribute to.

![](images/typing-jim-carrey.gif)

---

# Standardizing How We Work

As the IT department grows, we need consistent processes.

Some areas we can improve:

- Ticket assignment
- Onboarding and offboarding
- Hardware deployment
- Account management
- Software requests
- Documentation
- Project tracking

The goal isn't to create more paperwork.

The goal is to make it easier for us to know **who is responsible, what needs to be done, and where the information is.**

---

# Developing the IT Team

I also want us to continue developing our technical skills.

Each person on the team has different strengths and areas they are interested in.

We should be using that to build the department.

Areas we can continue developing:

- Networking
- Cyber security
- Systems administration
- Cloud / Microsoft 365
- Linux
- Databases
- Programming
- Automation
- Documentation

The more knowledge we build internally, the less we have to depend on outside support for everything.

---

# Projects & Future Planning

IT has a lot of projects and improvements ahead of us.

Some of the areas we need to continue looking at:

- Infrastructure improvements
- Microsoft 365 and cloud services
- Business applications
- Cyber security
- Network improvements
- Server infrastructure
- Automation
- Documentation
- IT policies and procedures

We need to make sure projects are properly planned, assigned and followed through.

![](images/linux.gif)

---

# My Goal for IT

My goal is to help build an IT department that is: To have a fully functional Department rather than only IT technicians. I want it all, Cyber security, Network Admin, System Admin, etc.

### Organized

Everyone knows what they are responsible for.

### Documented

Information isn't stuck in one person's head.

### Secure

Security is part of everything we do.

### Proactive

We identify problems before they become emergencies.

### Self-Sufficient

We continue building our own technical knowledge and capabilities.

---

# What I Want Us to Discuss

I don't want this retreat to just be a series of updates.

I want us to talk about:

- What are we doing well?
- Where are we struggling?
- What needs to change?
- What should we stop doing?
- What should we start doing?
- What skills do we need to build?
- What should our priorities be for the next 6–12 months?

Most importantly:

## What does IT need to look like a year from now?

![](images/penny.gif)

---

# Closing

We have a lot of different responsibilities within IT, but we're all working toward the same goal.

The better we communicate, document our work and support each other, the better we can support the organization.

## Let's figure out what we need to do and build it together.
